<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공 튕기기</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #f4f1ea;
    font-family: -apple-system, "Apple SD Gothic Neo", sans-serif;
    overflow: hidden;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    word-break: keep-all;
  }
  #floor {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 80px; background: #d9d2c3; border-top: 2px solid #b8ae99;
  }
  #ball {
    position: absolute; left: 50%; top: 0;
    width: 80px; height: 80px; margin-left: -40px;
    border-radius: 50%;
    background: #e8553b;
    transform-origin: 50% 100%;   /* 바닥 기준으로 찌그러짐 */
    will-change: transform;
  }
  #hint {
    position: absolute; top: 24px; left: 0; right: 0;
    text-align: center; color: #6b6355; font-size: 16px;
  }
  #count {
    position: absolute; top: 52px; left: 0; right: 0;
    text-align: center; color: #9a9080; font-size: 14px;
  }
</style>
</head>
<body>
<div id="hint">화면을 누르면 공이 떨어집니다</div>
<div id="count"></div>
<div id="floor"></div>
<div id="ball"></div>

<script>
(() => {
  const ball = document.getElementById('ball');
  const countEl = document.getElementById('count');

  const BALL = 80;          // 공 지름(px)
  const FLOOR_H = 80;       // 바닥 높이(px)
  const G = 2600;           // 중력 가속도(px/s^2)
  const RESTITUTION = 0.6;  // 반발 계수(속도 비율) -> 튕김 높이는 0.36배씩
  const BOUNCES = 3;        // 바닥에 닿은 뒤 튀어 오르는 횟수
  const SQUASH_X = 1.3, SQUASH_Y = 0.7;
  const SQUASH_TIME = 0.14; // 찌그러졌다 돌아오는 시간(s)

  let timeline = [];  // {type, start, dur, ...}
  let floorY = 0;     // 공 top 값이 바닥에 닿았을 때
  let startTime = 0;
  let rafId = null;

  // 구간 목록 만들기: 낙하 → (찌그러짐 → 상승/하강) x3 → 마지막 찌그러짐 → 정지
  function buildTimeline(topY) {
    floorY = window.innerHeight - FLOOR_H - BALL;
    const h0 = Math.max(floorY - topY, 1);
    const list = [];
    let t = 0;

    // 1) 처음 낙하
    const tFall = Math.sqrt(2 * h0 / G);
    list.push({ type: 'fall', start: t, dur: tFall, h: h0 });
    t += tFall;

    let v = Math.sqrt(2 * G * h0);  // 바닥 충돌 속도
    for (let i = 0; i < BOUNCES; i++) {
      list.push({ type: 'squash', start: t, dur: SQUASH_TIME, hit: i + 1 });
      t += SQUASH_TIME;
      v *= RESTITUTION;
      const tAir = 2 * v / G;        // 올라갔다 내려오는 시간
      list.push({ type: 'bounce', start: t, dur: tAir, v0: v, bounce: i + 1 });
      t += tAir;
    }
    // 마지막 착지: 찌그러졌다 원래 모양으로 돌아오며 정지
    list.push({ type: 'squash', start: t, dur: SQUASH_TIME, hit: BOUNCES + 1 });
    t += SQUASH_TIME;
    list.push({ type: 'rest', start: t, dur: 0 });
    return list;
  }

  // 찌그러짐 곡선: 0 → 1 → 0 (사인 반주기)
  function squashAmount(p) { return Math.sin(Math.PI * p); }

  function render(y, sx, sy) {
    ball.style.transform =
      `translateY(${y}px) scale(${sx}, ${sy})`;
  }

  function frame(now) {
    const t = (now - startTime) / 1000;
    let seg = timeline[timeline.length - 1];
    for (const s of timeline) {
      if (t < s.start + s.dur) { seg = s; break; }
    }
    const lt = Math.max(0, t - seg.start);

    if (seg.type === 'fall') {
      const y = floorY - seg.h + 0.5 * G * lt * lt;
      render(Math.min(y, floorY), 1, 1);
    } else if (seg.type === 'squash') {
      const k = squashAmount(Math.min(lt / seg.dur, 1));
      // 충격이 약해질수록 덜 찌그러지게 하지 않고, 요구대로 매번 1.3 / 0.7까지
      render(floorY, 1 + (SQUASH_X - 1) * k, 1 + (SQUASH_Y - 1) * k);
    } else if (seg.type === 'bounce') {
      const height = seg.v0 * lt - 0.5 * G * lt * lt;
      render(floorY - Math.max(height, 0), 1, 1);
      countEl.textContent = `튕김 ${seg.bounce} / ${BOUNCES}`;
    } else {
      render(floorY, 1, 1);
      countEl.textContent = `${BOUNCES}번 튕기고 멈춤`;
      rafId = null;
      return;
    }
    rafId = requestAnimationFrame(frame);
  }

  function drop() {
    if (rafId) cancelAnimationFrame(rafId);
    const topY = 90; // 시작 높이(안내 문구 아래)
    timeline = buildTimeline(topY);
    countEl.textContent = '';
    render(topY, 1, 1);
    startTime = performance.now();
    rafId = requestAnimationFrame(frame);
  }

  // 처음엔 공을 위에 띄워 둠
  render(90, 1, 1);
  window.addEventListener('pointerdown', drop);
  window.addEventListener('resize', () => {
    if (!rafId) {
      floorY = window.innerHeight - FLOOR_H - BALL;
      if (timeline.length) render(floorY, 1, 1);
    }
  });
})();
</script>
<script src="../../../assets/bar.js" data-no="71" data-kind="follow"></script>
</body>
</html>
