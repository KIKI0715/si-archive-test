<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 넣은 문장: 문장에서 강조한 단어 한 칸만 0.8초마다 다음 단어로 바뀌게 해 줘. 옛 단어는 위로 20px 빠지고 새 단어는 아래서 0.3초에 올라와. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한 단어만 바뀌는 문장</title>
<style>
  :root {
    --bg: #f6f5f2;
    --fg: #1d1d1f;
    --accent: #3b5bdb;
    --move: 20px;   /* 옛 단어가 위로 빠지는 거리 / 새 단어가 아래에서 올라오는 거리 */
    --dur: 0.3s;    /* 단어가 빠지고 올라오는 시간 */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 16px;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    word-break: keep-all;
    overflow-wrap: break-word;
  }
  .line {
    margin: 0;
    font-size: clamp(28px, 6vw, 64px);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.3;
    text-align: center;
  }
  /* 바뀌는 한 칸: 단어 길이에 맞춰 폭이 같이 바뀐다 */
  .slot {
    position: relative;
    display: inline-block;
    vertical-align: top;
    height: 1.3em;
    white-space: nowrap;
    transition: width var(--dur) ease;
  }
  /* 단어 하나: 처음엔 아래쪽, 투명 */
  .slot .w {
    position: absolute;
    left: 0;
    top: 0;
    line-height: 1.3;
    color: var(--accent);
    opacity: 0;
    transform: translateY(var(--move));
    transition:
      transform var(--dur) cubic-bezier(0.22, 1, 0.36, 1),
      opacity var(--dur) ease-out;
  }
  /* 제자리 */
  .slot .w.in {
    opacity: 1;
    transform: translateY(0);
  }
  /* 위로 빠지며 사라짐 */
  .slot .w.out {
    opacity: 0;
    transform: translateY(calc(var(--move) * -1));
  }
  @media (prefers-reduced-motion: reduce) {
    .slot, .slot .w { transition: none; }
  }
</style>
</head>
<body>
  <p class="line">우리는 <span class="slot"></span> 디자인을 배웁니다</p>

<script>
  var WORDS = ['모션', '인터랙션', '경험', '서비스', '공간']; // 차례로 바뀔 단어
  var INTERVAL = 800; // 0.8초마다 다음 단어
  var DUR = 300;      // 0.3초 (위 --dur 과 같은 값)

  var slot = document.querySelector('.slot');
  var idx = 0;

  function makeWord(text) {
    var s = document.createElement('span');
    s.className = 'w';
    s.textContent = text;
    return s;
  }
  function fit(el) {
    slot.style.width = el.offsetWidth + 'px';
  }

  // 첫 단어는 제자리에 바로 놓는다
  var cur = makeWord(WORDS[0]);
  cur.classList.add('in');
  slot.appendChild(cur);
  fit(cur);

  setInterval(function () {
    idx = (idx + 1) % WORDS.length;

    // 새 단어: 아래에서 대기 → 다음 프레임에 제자리로
    var next = makeWord(WORDS[idx]);
    slot.appendChild(next);
    fit(next);
    next.offsetWidth; // 대기 상태를 먼저 그리게 함
    next.classList.add('in');

    // 옛 단어: 위로 빠지며 사라진 뒤 지움
    var old = cur;
    old.classList.remove('in');
    old.classList.add('out');
    setTimeout(function () { old.remove(); }, DUR);

    cur = next;
  }, INTERVAL);
</script>
<script src="../../../assets/bar.js" data-no="48" data-kind="follow"></script>
</body>
</html>
